# 실제 Windows에서 Setup 설치·재설치·제거를 검증한다.
name: Windows 배포 검사
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: NSIS 설치
        run: choco install nsis --no-progress -y
      - name: 핵심 검사
        run: npm test
      - name: 실제 MySQL 학습 계정 연결과 복구
        run: npm run test:engine
      - name: 실제 MySQL 정답과 읽기 권한 검사
        run: npm run test:mysql
      - name: Windows Setup 생성
        run: npm run release
      - name: 설치·재설치·실행·제거 검사
        shell: pwsh
        run: ./tests/windows-installer.ps1
      - name: 새 Windows 폴더 압축
        shell: pwsh
        run: Compress-Archive -Path dist/YourSQL-win32-x64 -DestinationPath dist/YourSQL-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: YourSQL-Setup-x64
          path: |
            dist/YourSQL-Setup-x64.exe
            dist/YourSQL-Windows-x64.zip
          if-no-files-found: error
