# 실제 Windows에서 배포 ZIP의 설치·실패 복구 경로를 검증한다.
name: Windows 업데이트 검사
on:
  push:
    branches: [fix/windows-update]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 실제 MySQL 학습 계정 연결과 복구
        run: npm run test:engine
      - name: 실제 MySQL 정답과 읽기 권한 검사
        run: npm run test:mysql
      - run: npm run package:windows
      - name: 새 Windows 빌드 압축
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/YourSQL-win32-x64 -DestinationPath dist/YourSQL-Windows-x64.zip
      - name: 보조 프로그램 시작 실패 처리
        run: node tests/updates-packaged.cjs --helper-failure
      - name: 실제 앱 교체와 재시작
        run: node tests/updates-packaged.cjs
      - name: 핵심 검사와 보조 프로그램 복구
        if: ${{ !cancelled() }}
        run: npm test
