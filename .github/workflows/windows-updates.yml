# 실제 Windows에서 Setup 설치·재설치·제거를 검증한다.
name: Windows 배포 검사
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: '로컬 검증용 빌드만 생성 (화면·설치 검증 미완료)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: NSIS 설치
        run: choco install nsis --no-progress -y
      - name: 핵심 검사
        run: npm test
      - name: 실제 MySQL 학습 계정 연결과 복구
        run: npm run test:engine
      - name: 실제 MySQL 정답과 읽기 권한 검사
        run: npm run test:mysql
      - name: 소스 앱 학습·재시작 검사
        if: ${{ !inputs.build_only }}
        run: npm run test:ui
      - name: Windows Setup 생성
        run: npm run release
      - name: 설치·재설치·실행·제거 검사
        if: ${{ !inputs.build_only }}
        shell: pwsh
        run: ./tests/windows-installer.ps1
      - name: 새 배포 폴더·ZIP 검사
        run: node tests/distribution-themes.cjs release windows
      - name: 배포 앱과 알림·복구 검사
        if: ${{ !inputs.build_only }}
        run: |
          npm run test:packaged
          npm run test:daily-reminder -- --packaged
          npm run test:recovery
      - uses: actions/upload-artifact@v4
        with:
          name: YourSQL-local-${{ inputs.build_only && 'build-only' || 'tested' }}-x64
          path: |
            dist/YourSQL-Setup-x64.exe
            dist/YourSQL-Windows-x64.zip
          if-no-files-found: error
